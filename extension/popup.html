<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HaloMCP Cookie Pusher</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; width: 340px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .destinations { list-style: none; padding: 0; margin: 0 0 12px; }
    .destinations li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .destinations li:last-child { border-bottom: none; }
    .dest-row { display: flex; gap: 8px; align-items: flex-start; }
    .dest-name { font-weight: 600; }
    .dest-url { color: #666; font-size: 11px; word-break: break-all; }
    .dest-status { margin-top: 4px; font-size: 12px; }
    .status-ok { color: #0a7d00; }
    .status-err { color: #c00; word-break: break-word; }
    .status-pending { color: #777; }
    button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px; }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #push { background: #06c; color: white; border-color: #06c; font-weight: 600; }
    #push:hover:not(:disabled) { background: #05a; }
    .actions { display: flex; justify-content: space-between; align-items: center; }
    .link { background: none; border: none; color: #06c; cursor: pointer; padding: 0; font-size: 12px; }
    .empty { color: #777; font-style: italic; padding: 8px 0; }
    .halo-warn { background: #fff3cd; padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>
  <h1>Push Halo cookies</h1>
  <div id="halo-warn" class="halo-warn"></div>
  <ul id="destinations" class="destinations"></ul>
  <div class="actions">
    <button id="push">Push to selected</button>
    <button id="open-options" class="link">Settings</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
